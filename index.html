<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wiki Ciudadanía en Red</title>
<meta name="description" content="Wiki participativa de Ciudadanía en Red: las ideas del blog, trabajadas por el curso en tableros Kanban.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:ital,wght@0,400;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F0FF; --card:#FFFFFF; --ink:#22124A; --muted:#5E5285; --line:#22124A;
  --violet:#7B4DFF; --sky:#2FA8FF; --pink:#FF4F9A; --mint:#19C98A; --sun:#FFC83D; --coral:#FF7A45;
  --t-violet:#E9E0FF; --t-sky:#DCF0FF; --t-pink:#FFE0EE; --t-mint:#D6F7EA; --t-sun:#FFF2CC; --t-coral:#FFE5D9;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --shadow:5px 5px 0 var(--line);
  --link:#6A3BF0; --hl:#FFE27A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#160D33; --card:#231650; --ink:#F3EEFF; --muted:#BDB2E6; --line:#0A0520;
    --t-violet:#33246B; --t-sky:#163A5C; --t-pink:#4A1A3A; --t-mint:#123F33; --t-sun:#4A3A12; --t-coral:#4A2416;
    --link:#B79BFF; --hl:#6B4FD8;
  }
}
:root[data-theme="dark"]{
  --bg:#160D33; --card:#231650; --ink:#F3EEFF; --muted:#BDB2E6; --line:#0A0520;
  --t-violet:#33246B; --t-sky:#163A5C; --t-pink:#4A1A3A; --t-mint:#123F33; --t-sun:#4A3A12; --t-coral:#4A2416;
  --link:#B79BFF; --hl:#6B4FD8;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 130px);scroll-behavior:smooth}
body{margin:0;background-color:var(--bg);color:var(--ink);font-family:var(--body);font-size:1.08rem;line-height:1.7;
  background-image:radial-gradient(color-mix(in srgb,var(--violet) 18%,transparent) 1.5px,transparent 1.5px);background-size:26px 26px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--violet);z-index:30}
a{color:var(--link);font-weight:700}
:focus-visible{outline:4px solid var(--sun);outline-offset:3px;border-radius:8px}
h1,h2,h3,h4{font-family:var(--display);line-height:1.12;margin:0 0 .5em;font-weight:700}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
.wrap{max-width:1180px;margin:0 auto;padding:0 1.25rem}

/* Barra */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--violet);border-bottom:3px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:.8rem;min-height:62px}
.brand{font-family:var(--display);font-weight:700;font-size:1.2rem;color:#fff!important;text-decoration:none;display:flex;align-items:center;gap:.5rem;white-space:nowrap}
.brand .logo{background:var(--sun);border:3px solid var(--line);border-radius:12px;width:38px;height:38px;display:grid;place-items:center;font-size:1.2rem;transform:rotate(-6deg)}
.pass{margin-left:auto;display:flex;gap:.3rem;align-items:center;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.5);border-radius:99px;padding:.15rem .6rem}
.pass span{font-size:1.15rem;filter:grayscale(1);opacity:.45;transition:.2s}
.pass span.on{filter:none;opacity:1}
.theme-btn{background:var(--sun);border:3px solid var(--line);border-radius:12px;width:42px;height:42px;cursor:pointer;font-size:1.1rem}

/* Estructura */
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);gap:2rem;padding-top:2rem;padding-bottom:3rem}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);align-self:start;max-height:calc(100vh - 100px);overflow-y:auto;padding:0 .4rem .6rem 0}
.side h2{font-size:.82rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:.9rem 0 .4rem}
.side h2:first-child{margin-top:0}
.side nav{display:grid;gap:.4rem}
.side a{display:flex;align-items:center;gap:.6rem;text-decoration:none;color:var(--ink);font-family:var(--display);font-weight:600;font-size:1rem;line-height:1.2;background:var(--card);border:3px solid var(--line);border-radius:14px;padding:.35rem .7rem;box-shadow:3px 3px 0 var(--line);transition:transform .12s}
.side a:hover{transform:translate(-2px,-2px)}
.side a .e{font-size:1.15rem}
.side a[aria-current="page"]{background:var(--sun);color:#22124A}
.side a.done::after{content:"✓";margin-left:auto;font-weight:700;color:var(--mint)}
.side a[aria-current="page"].done::after{color:#22124A}
@media (max-width:900px){
  .shell{grid-template-columns:1fr;gap:1rem;padding-top:1rem}
  .side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:10;background:var(--bg);padding:.5rem 1.25rem;margin:0 -1.25rem;border-bottom:3px solid var(--line);max-height:none;overflow:visible}
  .side h2{display:none}
  #nav{display:flex;overflow-x:auto;gap:.5rem;padding:.2rem .2rem .5rem}
  .side nav{display:contents}
  .side a{white-space:nowrap;flex:none}
  .side a.done::after{display:none}
}

/* Piezas */
.btn{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--display);font-weight:700;font-size:1.05rem;background:var(--sun);color:#22124A!important;padding:.75rem 1.25rem;border-radius:16px;border:3px solid var(--line);box-shadow:var(--shadow);text-decoration:none;cursor:pointer;transition:transform .12s, box-shadow .12s;margin:0 .6rem .7rem 0}
.btn:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--line)}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--line)}
.btn.alt{background:var(--mint)}
.btn.pink{background:var(--pink);color:#fff!important}
.btn.small{font-size:.9rem;padding:.4rem .8rem;box-shadow:3px 3px 0 var(--line)}
.chip{display:inline-block;font-family:var(--display);font-weight:600;font-size:.85rem;padding:.2rem .7rem;border-radius:99px;border:2px solid var(--line);background:#fff;color:#22124A}
.hint{color:var(--muted);font-weight:700;font-size:.95rem;margin:.4rem 0}

/* Inicio */
.hero{background:var(--card);border:4px solid var(--line);border-radius:28px;box-shadow:10px 10px 0 var(--line);padding:2rem 1.8rem;overflow:hidden}
.hero h1{font-size:clamp(2.3rem,7vw,4.3rem);line-height:.95;margin-bottom:1rem}
.hero h1 span{display:inline-block;padding:.05em .25em;border:4px solid var(--line);border-radius:20px;box-shadow:6px 6px 0 var(--line);color:#fff}
.hero h1 .w1{background:var(--pink);transform:rotate(-2.5deg)}
.hero h1 .w2{background:var(--sky);transform:rotate(2deg);margin-top:.15em}
.lead{font-size:1.2rem;font-weight:700;max-width:38ch;margin:0 0 1.4rem}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;margin-top:1.4rem}
.mini .c{border:3px solid var(--line);border-radius:14px;padding:.5rem;background:var(--bg);min-height:120px}
.mini .c b{display:block;font-family:var(--display);font-size:.9rem;margin-bottom:.4rem}
.mini .k{border:2px solid var(--line);border-radius:8px;height:22px;margin-bottom:.35rem;animation:bob 3.4s ease-in-out infinite}
.mini .k:nth-child(odd){animation-delay:-1.2s}
@keyframes bob{50%{transform:translateY(-4px)}}
.bubble{margin:2rem 0;background:var(--sun);color:#22124A;border:4px solid var(--line);border-radius:28px;box-shadow:8px 8px 0 var(--line);padding:1.3rem 1.6rem;font-family:var(--display);font-weight:700;font-size:clamp(1.15rem,3vw,1.5rem);line-height:1.3;text-align:center}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem;margin:1.6rem 0}
.three .s{border:4px solid var(--line);border-radius:22px;box-shadow:6px 6px 0 var(--line);padding:1.1rem 1.2rem;color:#22124A}
.three .s .n{font-size:2.4rem;line-height:1;display:block}
.three .s h3{font-size:1.25rem;margin:.4rem 0 .2rem}
.three .s p{margin:0;font-size:1rem}
.sect{font-size:1.6rem;margin:2rem 0 1rem;display:inline-block;padding:.15em .6em;border:4px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--shadow);transform:rotate(-1deg)}
.route{display:grid;grid-template-columns:repeat(3,1fr);gap:1.1rem;list-style:none;padding:0;margin:0}
.route a{display:flex;flex-direction:column;height:100%;text-decoration:none;color:var(--ink);font-weight:400;background:var(--card);border:4px solid var(--line);border-radius:22px;box-shadow:6px 6px 0 var(--line);overflow:hidden;transition:transform .15s}
.route a:hover{transform:translate(-3px,-3px) rotate(-.6deg)}
.route .art{height:90px;display:grid;place-items:center;border-bottom:4px solid var(--line);font-size:3rem;position:relative}
.route .num{position:absolute;top:8px;left:8px;width:34px;height:34px;border-radius:50%;background:var(--card);border:3px solid var(--line);font-family:var(--display);font-weight:700;display:grid;place-items:center;font-size:1rem}
.route .txt{padding:.7rem .9rem 1rem}
.route h3{font-size:1.1rem;margin:.3rem 0}
.route p{margin:0;color:var(--muted);font-size:.92rem;line-height:1.4}
@media (max-width:960px){.route{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.route{grid-template-columns:1fr}.three{grid-template-columns:1fr}.mini{grid-template-columns:1fr 1fr}}
.passcard{margin-top:1.6rem;background:var(--t-sun);border:4px solid var(--line);border-radius:24px;box-shadow:8px 8px 0 var(--line);padding:1.2rem 1.4rem}
.passcard .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:.8rem;margin-top:.6rem}
.bd{display:flex;gap:.7rem;align-items:center;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:.5rem .8rem}
.bd .e{font-size:2rem;filter:grayscale(1);opacity:.4}
.bd.on .e{filter:none;opacity:1}
.bd small{display:block;color:var(--muted);font-weight:700;line-height:1.3}
.bd b{font-family:var(--display)}

/* Artículo */
.banner{border:4px solid var(--line);border-radius:28px;box-shadow:10px 10px 0 var(--line);padding:1.6rem;display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:center;color:#22124A;margin-bottom:1.6rem}
.banner h1{font-size:clamp(1.7rem,4.6vw,2.7rem);margin:.5rem 0 .8rem}
.banner .emo{font-size:clamp(4rem,12vw,7rem);line-height:1;filter:drop-shadow(5px 5px 0 #22124A);transform:rotate(-8deg)}
.meta{display:flex;gap:.5rem;flex-wrap:wrap}
.meta span{background:rgba(255,255,255,.75);border:2px solid #22124A;border-radius:99px;padding:.2rem .75rem;font-family:var(--display);font-weight:600;font-size:.9rem;color:#22124A}
.steps{display:flex;gap:.35rem;margin-bottom:1.3rem}
.steps i{flex:1;height:10px;border-radius:99px;border:2px solid var(--line);background:var(--card)}
.steps i.on{background:var(--c)}
.body-card{background:var(--card);border:4px solid var(--line);border-radius:24px;box-shadow:8px 8px 0 var(--line);padding:1.6rem 1.8rem;overflow:hidden;margin-bottom:1.6rem}
.body-card p{margin:0 0 1.1rem}
.body-card h2{display:inline-block;font-size:1.4rem;margin:1.5rem 0 .9rem;padding:.25rem .9rem;border:3px solid var(--line);border-radius:14px;background:var(--c);color:#22124A;box-shadow:4px 4px 0 var(--line);transform:rotate(-1deg)}
.body-card h2:first-child{margin-top:0}
.body-card b.h{background:linear-gradient(transparent 55%,var(--hl) 55%);padding:0 .15em}
.body-card ul.cards{list-style:none;padding:0;margin:0 0 1.2rem;display:grid;gap:.6rem}
.body-card ul.cards li{background:var(--ct);border:3px solid var(--line);border-radius:14px;padding:.6rem .9rem .6rem 2.7rem;position:relative}
.body-card ul.cards li::before{content:"";position:absolute;left:.85rem;top:.9rem;width:16px;height:16px;border-radius:50%;background:var(--c);border:2.5px solid var(--line)}
.info{float:right;width:250px;margin:0 0 1rem 1.4rem;background:var(--ct);border:3px solid var(--line);border-radius:18px;box-shadow:5px 5px 0 var(--line);padding:.8rem 1rem;font-size:.95rem;line-height:1.5}
.info h3{font-size:1.05rem;margin-bottom:.4rem;text-align:center}
.info dl{margin:0}
.info dt{font-family:var(--display);font-weight:700;font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:.5rem}
.info dd{margin:0}
@media (max-width:640px){.info{float:none;width:auto;margin:0 0 1.2rem}.banner{grid-template-columns:1fr}.banner .emo{order:-1}.body-card{padding:1.2rem}}
blockquote.q{margin:1.6rem 0;background:var(--c);color:#22124A;border:4px solid var(--line);border-radius:24px;box-shadow:6px 6px 0 var(--line);padding:1.1rem 1.4rem 1.1rem 3.8rem;font-family:var(--display);font-weight:600;font-size:1.2rem;line-height:1.35;position:relative}
blockquote.q::before{content:"💡";position:absolute;left:1rem;top:1rem;font-size:2rem}
.think{margin:1.6rem 0;background:var(--sun);color:#22124A;border:4px solid var(--line);border-radius:24px;box-shadow:8px 8px 0 var(--line);padding:1.2rem 1.4rem;display:flex;gap:1rem;align-items:flex-start}
.think .e{font-size:2.6rem;line-height:1}
.think h3{font-size:1.25rem;margin-bottom:.3rem}
.think p{margin:0;font-weight:700}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1.6rem}
.pager a{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:18px;box-shadow:5px 5px 0 var(--line);padding:.9rem 1.1rem;font-family:var(--display);font-weight:600}
.pager small{display:block;color:var(--muted);font-size:.85rem}
.pager .next{text-align:right}
@media (max-width:560px){.pager{grid-template-columns:1fr}}
.table-wrap{overflow-x:auto;margin:0 0 1.2rem}
table.cmp{border-collapse:separate;border-spacing:0;width:100%;min-width:520px;border:3px solid var(--line);border-radius:16px;overflow:hidden;font-size:1rem}
table.cmp th,table.cmp td{padding:.55rem .8rem;text-align:left;border-bottom:2px solid var(--line);vertical-align:top}
table.cmp thead th{font-family:var(--display);color:#22124A;background:var(--c)}
table.cmp tbody tr:last-child td{border-bottom:0}
table.cmp td:first-child{font-family:var(--display);font-weight:600;background:var(--ct)}
.cols4{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem;margin:1rem 0 1.4rem}
.cols4 div{border:3px solid var(--line);border-radius:16px;padding:.7rem .8rem;color:#22124A;font-size:.95rem;line-height:1.45;box-shadow:4px 4px 0 var(--line)}
.cols4 b{display:block;font-family:var(--display);font-size:1.1rem;margin-bottom:.2rem}
@media (max-width:900px){.cols4{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.cols4{grid-template-columns:1fr}}
.sec-title{font-size:1.5rem;margin:0 0 .4rem}
.panel{background:var(--card);border:4px solid var(--line);border-radius:24px;box-shadow:8px 8px 0 var(--line);padding:1.4rem 1.6rem;margin-bottom:1.6rem}
@media (max-width:640px){.panel{padding:1.1rem}}

/* Tablero */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.8rem;margin:1rem 0}
@media (max-width:980px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.board{grid-template-columns:1fr}}
.bcol{border:3px solid var(--line);border-radius:18px;background:var(--bg);min-height:170px;display:flex;flex-direction:column;overflow:hidden}
.bcol.over{outline:4px dashed var(--violet);outline-offset:-4px}
.bhead{padding:.5rem .8rem;border-bottom:3px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:.4rem;font-family:var(--display);font-weight:700;color:#22124A}
.bhead small{background:rgba(255,255,255,.75);border:2px solid #22124A;border-radius:99px;padding:0 .5rem;font-size:.85rem}
.bhead small.full{background:#fff;color:#D0164E}
.bbody{padding:.6rem;display:grid;gap:.5rem;align-content:start;flex:1}
.kc{background:var(--cc);color:#22124A;border:3px solid var(--line);border-radius:12px;padding:.45rem .6rem;box-shadow:3px 3px 0 var(--line);font-weight:700;font-size:.93rem;line-height:1.3;cursor:grab}
.kc.local{border-style:dashed}
.kc .who{display:block;font-size:.78rem;opacity:.75;margin-top:.2rem}
.kc .acts{display:flex;gap:.3rem;margin-top:.4rem;justify-content:flex-end}
.kc .acts button,.post button{border:2px solid #22124A;background:#fff;color:#22124A;border-radius:8px;cursor:pointer;font-weight:800;min-width:30px;height:28px;line-height:1}
.kc .acts button:hover{background:var(--sun)}
.toast{min-height:2.4rem;margin:.4rem 0;padding:.45rem .9rem;border-radius:14px;border:3px solid transparent;font-weight:800;font-family:var(--display)}
.toast.show{border-color:var(--line);background:var(--t-sky)}
.toast.warn{background:var(--t-pink)}
.toast.good{background:var(--t-mint)}
.status{border:3px solid var(--line);border-radius:16px;padding:.55rem .9rem;font-weight:700;margin:0 0 .8rem;font-size:.97rem;line-height:1.45}
.status.green{background:var(--t-mint)}.status.yellow{background:var(--t-sun)}.status.blue{background:var(--t-sky)}
.addrow{display:grid;grid-template-columns:150px 1fr auto;gap:.6rem;margin:.8rem 0 0;align-items:center}
@media (max-width:640px){.addrow{grid-template-columns:1fr}}
.inp{font:inherit;font-weight:700;padding:.6rem .9rem;border:3px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);width:100%}
.addrow .btn{margin:0}
.wall{display:grid;gap:.8rem;margin-top:1rem}
.post{display:grid;grid-template-columns:auto 1fr auto;gap:.8rem;align-items:start;background:var(--cc);color:#22124A;border:3px solid var(--line);border-radius:16px;box-shadow:4px 4px 0 var(--line);padding:.7rem .9rem}
.post.local{border-style:dashed}
.post .em{font-size:2rem;line-height:1}
.post p{margin:0;font-weight:700}
.post small{font-weight:700;opacity:.75}
.emos{display:flex;gap:.4rem;flex-wrap:wrap;margin:.5rem 0}
.emos label{cursor:pointer}
.emos input{position:absolute;opacity:0}
.emos span{display:grid;place-items:center;width:44px;height:44px;font-size:1.5rem;border:3px solid var(--line);border-radius:12px;background:var(--card)}
.emos input:checked + span{background:var(--sun);transform:scale(1.08)}
.emos input:focus-visible + span{outline:4px solid var(--violet)}

/* Listas de chequeo */
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem}
@media (max-width:980px){.tools{grid-template-columns:1fr}}
.tool{background:var(--card);border:4px solid var(--line);border-radius:22px;box-shadow:6px 6px 0 var(--line);overflow:hidden;display:flex;flex-direction:column}
.tool .head{padding:.9rem 1.1rem;border-bottom:4px solid var(--line);display:flex;align-items:center;gap:.7rem;color:#22124A}
.tool .head span{font-size:2.1rem}
.tool h3{font-size:1.15rem;margin:0}
.tool ul{list-style:none;margin:0;padding:.6rem .8rem;flex:1}
.tool li{margin:.3rem 0}
.tool label{display:flex;gap:.6rem;align-items:flex-start;cursor:pointer;padding:.45rem .6rem;border-radius:12px;border:2px solid transparent;font-size:.97rem;line-height:1.45}
.tool label:hover{background:var(--bg);border-color:var(--line)}
.tool input{position:absolute;opacity:0}
.tool .box{flex:none;width:26px;height:26px;border:3px solid var(--line);border-radius:8px;display:grid;place-items:center;background:var(--card);font-weight:800;margin-top:.05rem}
.tool input:checked ~ .box{background:var(--mint)}
.tool input:checked ~ .box::after{content:"✓";color:#22124A}
.tool input:checked ~ .t{opacity:.6;text-decoration:line-through}
.tool input:focus-visible ~ .box{outline:4px solid var(--violet);outline-offset:2px}
.tool .foot{padding:0 1rem 1rem}
.tool .bar{height:14px;border:2px solid var(--line);border-radius:99px;overflow:hidden;background:var(--bg)}
.tool .bar b{display:block;height:100%;width:0;transition:width .3s}
.progress{font-family:var(--display);font-weight:600;font-size:.92rem;margin:.4rem 0 0}

/* Glosario */
.search{width:100%;max-width:440px;font:inherit;font-weight:700;padding:.75rem 1rem;border:4px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);box-shadow:var(--shadow);margin-bottom:.6rem}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1.1rem;margin-top:1rem}
.fc{perspective:900px;height:190px}
.fc.hide{display:none}
.fc button{all:unset;cursor:pointer;display:block;width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s}
.fc button:focus-visible{outline:4px solid var(--sun);outline-offset:4px;border-radius:20px}
.fc.flip button{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border:4px solid var(--line);border-radius:20px;box-shadow:6px 6px 0 var(--line);padding:.9rem;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:#22124A}
.face.front.light{color:#fff}
.face.front strong{font-family:var(--display);font-size:1.25rem;line-height:1.15}
.face.front small{margin-top:.6rem;font-weight:700;opacity:.75}
.face.back{transform:rotateY(180deg);background:var(--card);color:var(--ink);font-size:.92rem;line-height:1.45}

/* Quiz */
.quiz .qq{font-family:var(--display);font-size:1.3rem;font-weight:700;margin:.3rem 0 1rem}
.quiz .who{display:inline-block;font-family:var(--display);font-weight:600;font-size:.85rem;background:var(--t-sun);border:2px solid var(--line);border-radius:99px;padding:.15rem .7rem}
.quiz .opt{display:block;width:100%;text-align:left;font:inherit;font-weight:700;border:3px solid var(--line);border-radius:14px;padding:.7rem 1rem;margin-bottom:.6rem;background:var(--card);color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--line)}
.quiz .opt:hover:not([disabled]){background:var(--t-sun)}
.quiz .opt.ok{background:var(--mint);color:#22124A}
.quiz .opt.no{background:var(--pink);color:#fff}
.quiz .fb{margin:.6rem 0 1rem;padding:.7rem 1rem;border-radius:14px;border:3px solid var(--line);background:var(--t-sky);font-weight:700}
.qbar{height:14px;border:2px solid var(--line);border-radius:99px;overflow:hidden;background:var(--bg);margin-bottom:1rem}
.qbar b{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--violet),var(--sky));transition:width .3s}

.video{display:flex;gap:1rem;align-items:center;text-decoration:none;color:var(--ink);background:var(--ct);border:4px solid var(--line);border-radius:24px;box-shadow:8px 8px 0 var(--line);padding:1rem 1.3rem;margin-bottom:1.6rem;transition:transform .12s}
.video:hover{transform:translate(-2px,-2px)}
.video .play{flex:none;width:58px;height:58px;border-radius:50%;background:var(--c);color:#22124A;border:3px solid var(--line);display:grid;place-items:center;font-size:1.5rem;box-shadow:3px 3px 0 var(--line)}
.video small{display:block;font-family:var(--display);font-weight:600;color:var(--muted)}
.video b{display:block;font-family:var(--display);font-size:1.15rem;line-height:1.2;margin:.1rem 0;color:var(--ink)}
.video em{display:block;font-style:normal;font-weight:700;font-size:.92rem;color:var(--muted)}
.video .vn{display:block;font-size:.95rem;font-weight:700;margin-top:.25rem}
.refs{list-style:none;padding:0;margin:0;font-size:.95rem}
.refs li{padding-left:2em;text-indent:-2em;margin-bottom:.6rem}
footer{background:var(--violet);color:#fff;border-top:4px solid var(--line);padding:2rem 0 2.6rem}
footer p{margin:.3rem 0}
footer .authors{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.8rem}
footer .authors span{background:var(--sun);color:#22124A;border:3px solid var(--line);border-radius:99px;padding:.25rem .8rem;font-family:var(--display);font-weight:600}
footer a{color:#fff}
.toastbadge{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 1.2rem);transform:translate(-50%,200%);background:var(--sun);color:#22124A;border:4px solid var(--line);border-radius:20px;box-shadow:6px 6px 0 var(--line);padding:.7rem 1.2rem;font-family:var(--display);font-weight:700;z-index:40;transition:transform .35s cubic-bezier(.2,1.6,.4,1);max-width:90vw;text-align:center}
.toastbadge.show{transform:translate(-50%,0)}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#/inicio" aria-label="Wiki Ciudadanía en Red, inicio"><span class="logo" aria-hidden="true">🌐</span>Wiki Ciudadanía en Red</a>
    <div class="pass" id="passStrip" role="img" aria-label="Tus insignias"></div>
    <button class="theme-btn" id="themeBtn" aria-label="Cambiar entre modo claro y oscuro">🌙</button>
  </div>
</header>

<div class="wrap shell">
  <aside class="side"><nav id="nav" aria-label="Páginas de la wiki"></nav></aside>
  <main id="main" aria-live="polite"></main>
</div>

<footer>
  <div class="wrap">
    <p style="font-family:var(--display);font-weight:700;font-size:1.3rem">🌐 Wiki Ciudadanía en Red</p>
    <p>Wiki participativa basada en el blog <a href="https://missparra.github.io/CiudadaniaEnRed/" target="_blank" rel="noopener">Ciudadanía en Red</a>, trabajada con tableros Kanban.</p>
    <p>Proyecto académico del Grupo 402, Maestría en Educación para la Innovación Pedagógica, Universidad del Área Andina.</p>
    <div class="authors" aria-hidden="true"><span>Jenny</span><span>Laura</span><span>María José</span><span>Diana</span></div>
  </div>
</footer>

<div class="toastbadge" id="badgeToast" role="status"></div>

<script>
/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function load(k, d){ try{ const v = JSON.parse(localStorage.getItem(k)); return v ?? d; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
const uid = () => Math.random().toString(36).slice(2, 9);
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const PASTEL = ['#FFE27A','#9BDBFF','#FFB3D4','#8DEBC6','#CDB8FF','#FFC2A3'];
const pastel = id => PASTEL[[...String(id)].reduce((a,c)=>a+c.charCodeAt(0),0) % PASTEL.length];

/* ---------- Tarjetas iniciales de cada tablero ---------- */
const SEEDS = {
 "cibercultura":[["Escribir un ejemplo de inteligencia colectiva que uso en mi vida","todo"],["Anotar en qué momentos de un día normal solo consumí contenido","todo"],["Explicar con mis palabras qué es la sociedad red","todo"],["Responder la pregunta “Para pensar” de la entrada","doing"],["Dar un ejemplo de cómo las redes cambian mi manera de prestar atención","review"]],
 "alfabetizacion":[["Decidir si soy más visitante o más residente en la red y por qué","todo"],["Ubicar mi fortaleza y mi reto en las 5 áreas de DigComp","todo"],["Explicar por qué crecer con pantallas no garantiza saber evaluar información","todo"],["Pensar cómo ayudar a alguien que evita la tecnología por miedo a equivocarse","doing"],["Dar un ejemplo de multitarea que me haya perjudicado al estudiar","review"]],
 "algoritmos":[["Mirar las primeras diez publicaciones de mi red y anotar qué sabe el algoritmo de mí","todo"],["Buscar el mismo tema en dos fuentes distintas y comparar","todo"],["Revisar la opción “por qué veo este anuncio” en una red","todo"],["Verificar una respuesta de IA antes de usarla","doing"],["Explicar con un ejemplo qué es una burbuja de filtro","review"]],
 "privacidad":[["Contar cuántas aplicaciones de mi celular usan mi ubicación y revisar si la necesitan","todo"],["Activar la verificación en dos pasos en mi correo","todo"],["Cambiar una contraseña repetida por una única","todo"],["Pensar antes de publicar fotos o datos de otras personas","doing"],["Explicar con un ejemplo la privacidad contextual","review"]],
 "etica":[["Citar la fuente de una imagen o un texto que usé","todo"],["Declarar cuándo y cómo usé IA en un trabajo","todo"],["Aplicar lectura lateral a una noticia sospechosa","todo"],["Practicar qué hacer si veo ciberacoso: guardar evidencia y denunciar","doing"],["Buscar una imagen con licencia Creative Commons","review"]],
 "brecha":[["Identificar quién se queda por fuera de la red en mi entorno","todo"],["Explicar los tres niveles de la brecha digital con un ejemplo","todo"],["Enseñarle a esa persona una práctica digital sencilla","todo"],["Imaginar una solución sin conexión: impresa o en grupo con un solo dispositivo","doing"],["Explicar por qué repartir equipos no basta","review"]],
 "caso1":[["Elegir la app que usamos: red social, videojuego o chatbot","todo"],["Leer la entrada 4 del blog: privacidad","todo"],["Aplicar la lista “Revisión de privacidad en 15 minutos” a nuestra app","todo"],["Revisar los permisos y la política de datos de la app","todo"],["Escribir el informe de una página","todo"],["Redactar la guía de tres ajustes recomendados","todo"],["Definir con el docente la meta del sprint","doing"]],
 "caso2":[["Publicación viral 1","todo"],["Publicación viral 2","todo"],["Publicación viral 3","todo"],["Publicación viral 4","todo"],["Publicación viral 5","todo"],["Publicación viral 6: se resuelve con ayuda de un chatbot; verifica si lo que respondió es cierto","todo"]],
 "caso3":[["S1 · Entrevistar a una persona de mi entorno: acceso, uso y habilidades, y resultados","todo"],["S1 · Contar con el equipo quiénes completaron el diagnóstico y qué barreras hubo","todo"],["S2 · Elegir una necesidad: hacer un trámite en línea o reconocer un mensaje fraudulento","todo"],["S2 · Diseñar la mini clase o la guía impresa","todo"],["S3 · Enseñarle a mi persona y registrar qué pasó","todo"],["S3 · Presentar el resultado al curso","todo"],["S1 · Preparar las preguntas de la entrevista","doing"]],
 "proyecto":[["S1 · Ficha de empatía: entrevistar a alguien que usa la red sin entenderla o que queda por fuera","todo"],["S2 · Elegir el problema de la campaña de ciudadanía digital","todo"],["S2 · Hacer las listas de chequeo de noticias y de privacidad con el equipo","todo"],["S3 · Prototipo de la campaña: afiche, guía impresa o video","doing"],["S3 · Declarar el uso de IA en el prototipo","review"],["S4 · Jugar la rana y comparar resultados","todo"],["S4 · Muestra a la comunidad: cada integrante le enseña algo a alguien","todo"]]
};

/* ---------- Pasaporte de insignias (microcredenciales) ---------- */
const ENTRY_SLUGS = ['cibercultura','alfabetizacion','algoritmos','privacidad','etica','brecha'];
const BADGES = [
  {k:'explorer', e:'🧭', t:'Explorador/a de la red', d:'Visita las 6 entradas'},
  {k:'manager',  e:'🗂️', t:'Gestor/a de tableros', d:'Lleva 5 tarjetas distintas a Hecho'},
  {k:'poster',   e:'📣', t:'Aportante', d:'Publica una tarjeta o una respuesta'},
  {k:'citizen',  e:'🏅', t:'Ciudadano/a en red', d:'Saca 6 o más aciertos en el quiz'}
];
let PASS = Object.assign({visited:[], doneIds:[], poster:false, quiz:0}, load('cr-pass', {}));
const earned = () => ({
  explorer: ENTRY_SLUGS.every(s => PASS.visited.includes(s)),
  manager: PASS.doneIds.length >= 5,
  poster: !!PASS.poster,
  citizen: PASS.quiz >= 6
});
let lastEarned = earned();
function passcardHTML(){
  const e = earned();
  return '<h3 style="margin:0">🛂 Tu pasaporte de ciudadano/a en red</h3><p class="hint" style="margin:.2rem 0 0">Cuatro insignias que reconocen lo que haces, no solo lo que lees. Se guardan en este navegador.</p><div class="row">' +
   BADGES.map(b => '<div class="bd '+(e[b.k]?'on':'')+'"><span class="e" aria-hidden="true">'+b.e+'</span><div><b>'+b.t+'</b><small>'+b.d+'</small></div></div>').join('') + '</div>';
}
function updatePass(){
  save('cr-pass', PASS);
  const now = earned();
  BADGES.forEach(b => { if(now[b.k] && !lastEarned[b.k]) toastBadge('🎉 ¡Nueva insignia! ' + b.e + ' ' + b.t); });
  lastEarned = now;
  $('#passStrip').innerHTML = BADGES.map(b => '<span class="'+(now[b.k]?'on':'')+'" title="'+esc(b.t)+': '+esc(b.d)+'">'+b.e+'</span>').join('');
  renderNav();
  const pc = $('#passcard'); if(pc) pc.innerHTML = passcardHTML();
}
let bt;
function toastBadge(t){ const el=$('#badgeToast'); el.textContent=t; el.classList.add('show'); clearTimeout(bt); bt=setTimeout(()=>el.classList.remove('show'),3800); }

/* ---------- Motor de tablero Kanban ---------- */
const COLS = [
  {id:'todo',   name:'Por hacer',   e:'📝', c:'var(--sky)'},
  {id:'doing',  name:'En progreso', e:'⚙️', c:'var(--sun)'},
  {id:'review', name:'Revisión',    e:'🔎', c:'var(--pink)'},
  {id:'done',   name:'Hecho',       e:'✅', c:'var(--mint)'}
];
function makeBoard(root, o){
  const CX = o.cols || COLS;
  let cards = [];
  root.innerHTML = '<div class="toast" role="status"></div><div class="board"></div>';
  const toast = root.querySelector('.toast'), boardEl = root.querySelector('.board');
  let tt;
  function say(t, type){ toast.textContent = t; toast.className = 'toast show ' + (type||''); clearTimeout(tt); tt = setTimeout(()=>{ toast.className='toast'; toast.textContent=''; }, 6500); }
  async function move(id, to){
    const c = cards.find(x => x.id === id); if(!c || c.col === to) return;
    if(to === 'done' && c.col !== 'review'){ say(o.lastMsg || '🔎 Una tarjeta solo llega a Hecho después de pasar por Revisión: otra persona debe revisarla y citar sus fuentes.', 'warn'); return; }
    const lim = o.wip[to], n = cards.filter(x => x.col === to).length;
    if(lim && n >= lim){ say('🚦 Límite WIP: en “' + CX.find(x=>x.id===to).name + '” caben máximo ' + lim + ' tarjetas. Termina o mueve alguna antes de empezar más.', 'warn'); return; }
    if(o.check){ const m = o.check(c, to); if(m){ say(m, 'warn'); return; } }
    try{ await o.onMove(c, to); if(to === 'done') say(o.doneMsg || '🎉 ¡Tarjeta terminada y revisada!', 'good'); }
    catch(e){ say('No se pudo mover la tarjeta. Inténtalo de nuevo.', 'warn'); }
  }
  function draw(){
    boardEl.innerHTML = '';
    CX.forEach((col, ci) => {
      const items = cards.filter(c => c.col === col.id);
      const lim = o.wip[col.id];
      const el = document.createElement('div'); el.className = 'bcol';
      const head = document.createElement('div'); head.className = 'bhead'; head.style.background = col.c;
      head.innerHTML = '<span>'+col.e+' '+col.name+'</span><small class="'+(lim&&items.length>=lim?'full':'')+'">'+items.length+(lim?'/'+lim:'')+'</small>';
      const body = document.createElement('div'); body.className = 'bbody';
      items.forEach(c => {
        const k = document.createElement('div'); k.className = 'kc' + (c.src==='local'?' local':''); k.style.setProperty('--cc', pastel(c.id));
        k.draggable = true;
        const t = document.createElement('span'); t.textContent = c.text; k.appendChild(t);
        if(c.alias){ const w = document.createElement('span'); w.className='who'; w.textContent = '✍️ ' + c.alias + (c.src==='local' ? ' · solo en tu navegador' : ''); k.appendChild(w); }
        if(c.owner){ const w = document.createElement('span'); w.className='who'; w.textContent = '🙋 Responsable: ' + c.owner; k.appendChild(w); }
        const acts = document.createElement('div'); acts.className = 'acts';
        if(ci > 0){ const b = document.createElement('button'); b.type='button'; b.textContent='◀'; b.setAttribute('aria-label','Mover a '+CX[ci-1].name); b.onclick = () => move(c.id, CX[ci-1].id); acts.appendChild(b); }
        if(ci < CX.length-1){ const b = document.createElement('button'); b.type='button'; b.textContent='▶'; b.setAttribute('aria-label','Mover a '+CX[ci+1].name); b.onclick = () => move(c.id, CX[ci+1].id); acts.appendChild(b); }
        if(o.canRemove && o.canRemove(c)){ const b = document.createElement('button'); b.type='button'; b.textContent='🗑'; b.setAttribute('aria-label','Borrar tarjeta'); b.onclick = () => o.onRemove(c); acts.appendChild(b); }
        k.appendChild(acts);
        k.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', c.id); e.dataTransfer.effectAllowed = 'move'; });
        body.appendChild(k);
      });
      el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('over'); });
      el.addEventListener('dragleave', () => el.classList.remove('over'));
      el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('over'); move(e.dataTransfer.getData('text/plain'), col.id); });
      el.appendChild(head); el.appendChild(body); boardEl.appendChild(el);
    });
  }
  return { set(arr){ cards = arr; draw(); }, say };
}

/* ---------- Capa compartida (db) con modo solo ---------- */
const Shared = { db:null, user:null, uid:null, teacher:false, canWrite:null, board:[], wall:[], ready:false };
let localBoard = load('cr-lboard', []);
let localWall  = load('cr-lwall', []);
let OWN = load('cr-own', {});
let OVR = load('cr-ovr', {});          // movimientos propios sobre tarjetas compartidas (solo lectura)
let SEEDED = load('cr-seeded', {});
const MOUNTED = [];
async function connect(){
  try{
    if(!window.claude || !window.claude.use){ Shared.ready = true; refresh(); return; }
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    Shared.db = db; Shared.user = user;
    if(user){
      try{ Shared.uid = await user.id(); }catch(e){}
      try{ Shared.teacher = await user.canEdit(); }catch(e){}
      try{ Shared.canWrite = await user.can('data.write'); }catch(e){}
    }
    if(db){
      db.collection('board').orderBy('ts').limit(1000).onSnapshot(s => { Shared.board = s.docs.map(d => ({...d.data(), id:d.id})); refresh(); }, () => {});
      db.collection('wall').orderBy('ts','desc').limit(500).onSnapshot(s => { Shared.wall = s.docs.map(d => ({...d.data(), id:d.id})); refresh(); }, () => {});
    }
  }catch(e){}
  Shared.ready = true; refresh();
}
function refresh(){ MOUNTED.forEach(f => f()); }
function ensureLocalSeeds(key){
  if(Shared.db || SEEDED[key] || !SEEDS[key]) return;
  SEEDS[key].forEach(([text, col]) => localBoard.push({id:uid(), entry:key, text, col, alias:'Profe', ts:Date.now()}));
  SEEDED[key] = true; save('cr-lboard', localBoard); save('cr-seeded', SEEDED);
}
function cardsFor(key){
  const sh = Shared.board.filter(c => c.entry === key).map(c => ({...c, id:'s:'+c.id, src:'shared', col: OVR['s:'+c.id] || c.col, owner: OWN['s:'+c.id] || c.owner}));
  const lo = localBoard.filter(c => c.entry === key).map(c => ({...c, id:'l:'+c.id, src:'local'}));
  return sh.concat(lo);
}
function postsFor(key){
  return Shared.wall.filter(c => c.entry === key).map(c => ({...c, id:'s:'+c.id, src:'shared'}))
    .concat(localWall.filter(c => c.entry === key).map(c => ({...c, id:'l:'+c.id, src:'local'}))).sort((a,b) => b.ts - a.ts).slice(0, 60);
}
const mine = c => c.src === 'local' || Shared.teacher || (c.uid && c.uid === Shared.uid);
function statusHTML(){
  if(!Shared.ready) return '<div class="status blue">⏳ Conectando con el tablero del curso…</div>';
  if(Shared.db && Shared.canWrite !== false) return '<div class="status green">🟢 <b>Modo compartido.</b> Lo que publiques o muevas aquí lo ve todo el curso en tiempo real.</div>';
  if(Shared.db) return '<div class="status yellow">🟡 <b>Solo lectura.</b> Ves lo que hacen tus compañeros, pero tu cuenta no puede escribir en lo compartido: tus tarjetas y movimientos quedan solo en este navegador. Pídele al profe permiso de colaborador.</div>';
  return '<div class="status blue">🔵 <b>Modo solo.</b> Puedes trabajar el tablero, pero tus aportes se quedan en este navegador. Cuando tu profe te comparta el enlace con permiso de colaborador, aquí aparecerá el tablero de todo el curso.</div>';
}
async function sharedAdd(coll, rec){
  if(Shared.uid) rec.uid = Shared.uid;
  if(Shared.db && Shared.canWrite !== false){
    try{ await Shared.db.collection(coll).add(rec); return 'shared'; }
    catch(e){ if(e && (e.code === 'invalid_argument' || e.code === 'not_granted')) Shared.canWrite = false; }
  }
  if(coll === 'board'){ localBoard.push({...rec, id:uid()}); save('cr-lboard', localBoard); }
  else { localWall.push({...rec, id:uid()}); save('cr-lwall', localWall); }
  return 'local';
}
function aliasValue(host){ return ((host.querySelector('.alias').value || '').trim().slice(0,16)) || 'Anónimo'; }

/* Sección de tablero compartido */
function mountBoard(host, key, wip, opts){
  opts = opts || {};
  host.innerHTML = '<div class="sbox"></div><div class="bhost"></div><div class="addrow"><input class="inp alias" maxlength="16" placeholder="Tu Nickname" aria-label="Tu Nickname"><input class="inp txt" maxlength="80" placeholder="Escribe una tarjeta nueva (máx. 80 letras)" aria-label="Texto de la tarjeta"><button class="btn add" type="button">➕ Agregar</button></div><p class="hint">Participa con un Nickname, no con tu nombre completo ni datos personales.</p>';
  const board = makeBoard(host.querySelector('.bhost'), {
    wip, cols: opts.cols, lastMsg: opts.lastMsg, doneMsg: opts.doneMsg,
    check: opts.perPerson ? (c, to) => {
      const lim = opts.perPerson[to]; if(!lim) return null;
      const me = aliasValue(host), n = cardsFor(key).filter(x => x.col === to && x.owner === me && x.id !== c.id).length;
      return n >= lim ? '🙋 ' + me + ', ya tienes ' + n + ' tarjetas en “' + opts.cols.find(x => x.id === to).name + '”. El máximo es ' + lim + ' por persona: termina una antes de tomar otra.' : null;
    } : null,
    canRemove: mine,
    onRemove: async c => {
      if(c.src === 'local'){ localBoard = localBoard.filter(x => 'l:'+x.id !== c.id); save('cr-lboard', localBoard); refresh(); return; }
      try{ await Shared.db.doc('board/' + c.id.slice(2)).delete(); }catch(e){}
    },
    onMove: async (c, to) => {
      const me = aliasValue(host), setOwner = !!opts.perPerson && to === 'doing';
      if(c.src === 'local'){ const x = localBoard.find(y => 'l:'+y.id === c.id); if(x){ x.col = to; if(setOwner) x.owner = me; save('cr-lboard', localBoard); } }
      else {
        let ok = false;
        if(Shared.db && Shared.canWrite !== false){
          try{ await Shared.db.doc('board/' + c.id.slice(2)).update(setOwner ? {col:to, owner:me} : {col:to}); delete OVR[c.id]; delete OWN[c.id]; ok = true; }
          catch(e){ Shared.canWrite = false; }
        }
        if(!ok){ OVR[c.id] = to; if(setOwner) OWN[c.id] = me; }
        save('cr-ovr', OVR); save('cr-own', OWN);
      }
      if(to === 'done' && !PASS.doneIds.includes(c.id)){ PASS.doneIds.push(c.id); updatePass(); }
      refresh();
    }
  });
  const redraw = () => { host.querySelector('.sbox').innerHTML = statusHTML(); if(Shared.ready) ensureLocalSeeds(key); board.set(cardsFor(key)); };
  MOUNTED.push(redraw); redraw();
  host.querySelector('.alias').value = load('cr-alias', '');
  host.querySelector('.alias').addEventListener('input', e => save('cr-alias', e.target.value));
  host.querySelector('.add').onclick = async () => {
    const inp = host.querySelector('.txt'), t = inp.value.trim();
    if(!t){ board.say('Escribe primero el texto de la tarjeta.', 'warn'); return; }
    const btn = host.querySelector('.add'); btn.disabled = true;
    const where = await sharedAdd('board', {entry:key, text:t, alias:aliasValue(host), col:'todo', ts:Date.now()});
    btn.disabled = false; inp.value = '';
    board.say(where === 'shared' ? '✅ Tarjeta publicada para todo el curso.' : '📝 Tarjeta guardada solo en tu navegador.', 'good');
    PASS.poster = true; updatePass(); refresh();
  };
}

/* Sección de respuestas (muro) */
function mountWall(host, key, emojis){
  host.innerHTML = '<div class="addrow"><input class="inp alias" maxlength="16" placeholder="Tu Nickname" aria-label="Tu Nickname"><input class="inp txt" maxlength="160" placeholder="Escribe tu respuesta (máx. 160 letras)" aria-label="Tu respuesta"><button class="btn pink add" type="button">📣 Publicar</button></div>' +
    '<div class="emos" role="radiogroup" aria-label="Escoge un emoji">' + emojis.map((x,i) => '<label><input type="radio" name="emo" value="'+x+'" '+(i===0?'checked':'')+'><span>'+x+'</span></label>').join('') + '</div><div class="wall"></div>';
  const wall = host.querySelector('.wall');
  const draw = () => {
    const posts = postsFor(key); wall.innerHTML = '';
    if(!posts.length){ wall.innerHTML = '<p class="hint">Todavía no hay respuestas. ¡Sé el primero en publicar!</p>'; return; }
    posts.forEach(p => {
      const el = document.createElement('div'); el.className = 'post' + (p.src==='local'?' local':''); el.style.setProperty('--cc', pastel(p.id));
      const em = document.createElement('span'); em.className='em'; em.textContent = p.emoji || '💬';
      const mid = document.createElement('div'); const tx = document.createElement('p'); tx.textContent = p.text;
      const sm = document.createElement('small'); sm.textContent = '✍️ ' + (p.alias || 'Anónimo') + (p.src==='local' ? ' · solo en tu navegador' : '');
      mid.appendChild(tx); mid.appendChild(sm); el.appendChild(em); el.appendChild(mid);
      if(mine(p)){ const b = document.createElement('button'); b.type='button'; b.textContent='🗑'; b.setAttribute('aria-label','Borrar respuesta');
        b.onclick = async () => {
          if(p.src === 'local'){ localWall = localWall.filter(x => 'l:'+x.id !== p.id); save('cr-lwall', localWall); refresh(); }
          else { try{ await Shared.db.doc('wall/' + p.id.slice(2)).delete(); }catch(e){} }
        }; el.appendChild(b); }
      wall.appendChild(el);
    });
  };
  MOUNTED.push(draw); draw();
  host.querySelector('.alias').value = load('cr-alias', '');
  host.querySelector('.alias').addEventListener('input', e => save('cr-alias', e.target.value));
  host.querySelector('.add').onclick = async () => {
    const inp = host.querySelector('.txt'), t = inp.value.trim(); if(!t){ inp.focus(); return; }
    const emoji = (host.querySelector('input[name="emo"]:checked')||{}).value || '💬';
    const btn = host.querySelector('.add'); btn.disabled = true;
    await sharedAdd('wall', {entry:key, text:t, alias:aliasValue(host), emoji, ts:Date.now()});
    btn.disabled = false; inp.value = '';
    PASS.poster = true; updatePass(); refresh();
  };
}

const ENTRIES = [
 { id:'cibercultura', n:1, tag:'Cibercultura', e:'🌐', c:'var(--violet)', ct:'var(--t-violet)', min:4,
   t:'¿Qué es la cibercultura? (Y por qué ya vives en ella)',
   sum:'Las prácticas, valores y formas de pensar que surgen cuando convivimos con la tecnología.',
   body:`<p>Cuando buscas un tutorial para arreglar algo, comentas en el grupo de WhatsApp de la clase o editas un documento compartido, ya estás participando en la cibercultura. Pierre Lévy (2007) la define como el conjunto de prácticas, valores, actitudes y formas de pensamiento que se desarrollan junto con el ciberespacio.</p>
     <h2>Inteligencia colectiva</h2>
     <p>La idea central de Lévy es la <b class="h">inteligencia colectiva</b>: nadie lo sabe todo, pero todos saben algo, y la red permite juntar esos saberes. Wikipedia, los foros de ayuda y los recursos educativos abiertos son ejemplos. Esta misma wiki, construida entre todo el curso, también lo es.</p>
     <h2>La sociedad red</h2>
     <p>Para Manuel Castells (2001) vivimos en una <b class="h">sociedad red</b>: el conocimiento ya no es un recurso escaso guardado en bibliotecas, sino un flujo que circula y se transforma. Eso cambia quién tiene poder, quién participa y quién se queda por fuera.</p>
     <h2>La cibercultura también nos moldea</h2>
     <p>La tecnología no es una simple herramienta neutral. Paula Sibilia (2012) habla de <b class="h">subjetividades mediáticas</b>: formas de pensar, sentir y actuar que se construyen con los dispositivos. Las redes influyen en cómo nos mostramos, qué esperamos de los demás e incluso en cómo prestamos atención.</p>
     <blockquote class="q">Entender la cibercultura no es aprender a usar aplicaciones; es entender cómo esas aplicaciones cambian nuestra manera de aprender, relacionarnos y participar.</blockquote>`,
   think:'Piensa en un día normal. ¿En qué momentos participaste en la inteligencia colectiva y en cuáles solo consumiste contenido?', emojis:['💡','🤔','🙌','📱','🌐','💬'], video:{url:'https://www.youtube.com/watch?v=qugS5MaZ0L8', title:'Inteligencia colectiva para educadores: conferencia de Pierre Lévy (fragmento)', ch:'Canal de Enith Castaño Bermúdez', note:'En español · fragmento de una conferencia de Lévy organizada por la OEI e IBERTIC en 2015.'} },
 { id:'alfabetizacion', n:2, tag:'Alfabetización digital', e:'🧠', c:'var(--sky)', ct:'var(--t-sky)', min:4,
   t:'Usar no es lo mismo que saber',
   sum:'El mito del nativo digital y por qué manejar el celular no basta para ser competente en la red.',
   body:`<p>Marc Prensky (2001) popularizó la idea de los <b class="h">nativos digitales</b>: jóvenes que, por haber crecido con la tecnología, la dominarían de forma natural. La investigación posterior desmontó ese mito. Kirschner y De Bruyckere (2017) mostraron que nacer rodeado de pantallas no garantiza saber buscar, evaluar ni crear información con criterio, y que la multitarea perjudica el aprendizaje.</p>
     <p>David White y Alison Le Cornu (2011) propusieron mirar <i>cómo</i> usamos la red: los <b class="h">visitantes</b> entran para resolver algo puntual y salen; los <b class="h">residentes</b> viven allí parte de su vida social e intelectual. Una misma persona puede ser visitante en lo académico y residente en lo social.</p>
     <h2>Entonces, ¿qué es la alfabetización digital?</h2>
     <p>Paul Gilster (1997), quien acuñó el término, la describió como la capacidad de comprender y usar información en múltiples formatos a través de los computadores. Hoy el marco DigComp 2.2 (Vuorikari et al., 2022) la organiza en cinco áreas:</p>
     <ul class="cards"><li>Búsqueda y evaluación de información y datos.</li><li>Comunicación y colaboración.</li><li>Creación de contenido digital.</li><li>Seguridad, que incluye proteger los datos y el bienestar.</li><li>Resolución de problemas.</li></ul>
     <h2>La otra cara: no usar</h2>
     <p>También hay docentes, adultos y estudiantes que evitan la tecnología por miedo a equivocarse o porque nadie les enseñó. Ambos casos son falta de alfabetización digital, y ambos tienen solución.</p>`,
   think:'¿Eres más visitante o residente? ¿En qué áreas de DigComp te sientes fuerte y en cuál necesitas aprender más?', emojis:['🧠','🤓','🙈','🌱','💪','💬'], video:{url:'https://www.youtube.com/watch?v=-4N5qmVc3yU', title:'Digital Literacy: resumen del libro de Paul Gilster', ch:'Canal Fast Book Summaries', note:'En inglés · 4 minutos · resumen animado hecho por un canal independiente. Activa los subtítulos.'} },
 { id:'algoritmos', n:3, tag:'Sistemas digitales', e:'🤖', c:'var(--pink)', ct:'var(--t-pink)', min:5,
   t:'Cómo deciden los algoritmos lo que ves',
   sum:'Tu inicio en redes no es una ventana neutral: es una selección hecha para mantenerte conectado.',
   body:`<p>Un <b class="h">algoritmo</b> es un conjunto de instrucciones que procesa datos para tomar una decisión. En las redes sociales decide qué publicaciones aparecen primero en tu inicio, usando señales como lo que miras, cuánto tiempo te detienes, lo que te gusta, lo que compartes y lo que hacen personas parecidas a ti.</p>
     <h2>¿Para qué están diseñados?</h2>
     <p>La mayoría de plataformas gratuitas viven de la publicidad, así que su objetivo es que pases el mayor tiempo posible en ellas. Yann Moulier-Boutang (2011) llama <b class="h">capitalismo cognitivo</b> a este modelo, en el que la atención, el conocimiento y la creatividad de los usuarios se convierten en valor económico. El scroll infinito y la reproducción automática no son accidentes de diseño.</p>
     <h2>La burbuja de filtro</h2>
     <p>Eli Pariser (2011) advirtió que, al mostrarnos lo que ya nos gusta, los algoritmos nos encierran en una <b class="h">burbuja de filtro</b>: vemos cada vez más de lo mismo y menos de lo que piensa distinto. Eso facilita las ecocámaras, donde solo escuchamos opiniones que confirman las nuestras.</p>
     <h2>¿Y la inteligencia artificial?</h2>
     <p>Los chatbots de IA generativa funcionan prediciendo la respuesta más probable según los textos con los que fueron entrenados. Por eso pueden escribir con seguridad datos falsos o referencias que no existen. Además, como señala Cathy O’Neil (2016), los sistemas automatizados pueden reproducir los sesgos de sus datos.</p>
     <h2>Qué puedes hacer</h2>
     <ul class="cards"><li>Busca el mismo tema en fuentes distintas, no solo en tu red favorita.</li><li>Sigue a personas e instituciones que piensen diferente a ti.</li><li>Revisa la opción “por qué veo este anuncio” en tus redes.</li><li>Verifica siempre lo que te responde una IA antes de usarlo.</li></ul>`,
   think:'Abre tu red social más usada y mira las primeras diez publicaciones. ¿Qué crees que sabe el algoritmo de ti?', emojis:['🤖','🫧','🎰','🔍','✨','💬'], video:{url:'https://www.youtube.com/watch?v=BY6RZXJrU2o', title:'What Actually Makes an Algorithm Terrifying (con Cathy O’Neil)', ch:'Pódcast Super Data Science', note:'En inglés · pódcast de más de una hora: escucha un fragmento a partir del minuto 14 y activa los subtítulos.'} },
 { id:'privacidad', n:4, tag:'Privacidad', e:'🔒', c:'var(--mint)', ct:'var(--t-mint)', min:4,
   t:'Tus datos valen: privacidad en la vida cotidiana',
   sum:'Si no pagas por un servicio, probablemente estás pagando con tus datos.',
   body:`<p>Cada vez que usas una aplicación dejas una <b class="h">huella digital</b>: tu ubicación, tus contactos, tus búsquedas, las horas en que te conectas y hasta cuánto tardas en leer algo. Muchos de esos datos son <b class="h">metadatos</b>, información sobre tu información, y dicen mucho más de lo que parece.</p>
     <h2>Un mercado de comportamientos</h2>
     <p>Shoshana Zuboff (2019) describe el <b class="h">capitalismo de la vigilancia</b>: un modelo de negocio que recoge datos sobre nuestro comportamiento para predecirlo y venderlo. No es un problema solo de grandes empresas lejanas; también ocurre con aplicaciones educativas, juegos y plataformas que usamos a diario.</p>
     <h2>La privacidad depende del contexto</h2>
     <p>Helen Nissenbaum (2010) propone la <b class="h">integridad contextual</b>: compartir información no es malo en sí mismo; el problema aparece cuando un dato sale del contexto en el que lo entregamos. Contarle al médico un diagnóstico es apropiado; que llegue a una aseguradora o a un empleador, no.</p>
     <p>En Colombia, la Ley Estatutaria 1581 de 2012 protege los datos personales y reconoce el derecho a conocer, actualizar y rectificar la información que se recoge sobre las personas.</p>
     <h2>Prácticas básicas de cuidado</h2>
     <ul class="cards"><li>Revisa qué permisos tienen tus aplicaciones: cámara, micrófono, ubicación y contactos.</li><li>Usa contraseñas distintas para cada servicio y, si puedes, un gestor de contraseñas.</li><li>Activa la verificación en dos pasos en tu correo y tus redes.</li><li>Piensa antes de publicar fotos o datos de otras personas, en especial de menores de edad.</li></ul>
     <blockquote class="q">Por eso en esta wiki participas con un Nickname y sin datos personales: la privacidad también se practica aquí.</blockquote>`,
   think:'¿Cuántas aplicaciones de tu celular tienen acceso a tu ubicación? ¿Todas lo necesitan?', emojis:['🔒','🛡️','🔑','📍','🛒','💬'], video:{url:'https://www.youtube.com/watch?v=KOBzMcBKL4M', title:'Helen Nissenbaum: Internet Privacy and Security', ch:'American Academy of Arts & Sciences', note:'En inglés · conferencia de 2011 de la autora de la integridad contextual. Activa los subtítulos.'} },
 { id:'etica', n:5, tag:'Ética digital', e:'⚖️', c:'var(--sun)', ct:'var(--t-sun)', min:5,
   t:'Ética digital en la práctica',
   sum:'Autoría, inteligencia artificial, desinformación y ciberacoso: decisiones que tomamos con cada clic.',
   body:`<p>La ética digital no es un tema abstracto. Mike Ribble (2015) describe la ciudadanía digital como un conjunto de normas de comportamiento responsable en la red: acceso, comunicación, seguridad, derechos y responsabilidades. Estas son cuatro situaciones cotidianas donde se pone a prueba.</p>
     <h2>Respetar la autoría</h2>
     <p>Que algo esté en internet no significa que sea libre de usar. Cita siempre la fuente de textos, imágenes y videos, y busca recursos con <b class="h">licencias Creative Commons</b>, que indican cómo reutilizar una obra y a quién reconocer.</p>
     <h2>Usar la IA con honestidad</h2>
     <p>La IA puede ayudarte a entender un tema, organizar ideas o revisar un texto. Entregar como propio un trabajo hecho por una IA es una forma de plagio. Declara cuándo y cómo la usaste, verifica sus respuestas y no le entregues datos personales o confidenciales.</p>
     <h2>Verificar antes de compartir</h2>
     <p>La desinformación se propaga porque la compartimos sin revisar. Sam Wineburg y Sarah McGrew (2019) encontraron que los verificadores profesionales usan la <b class="h">lectura lateral</b>: en lugar de quedarse en la página sospechosa, abren otras pestañas para averiguar quién está detrás y qué dicen otras fuentes.</p>
     <h2>No ser espectador del ciberacoso</h2>
     <p>El anonimato y la distancia facilitan el acoso y los discursos de odio. Si lo ves, no lo compartas ni lo celebres: apoya a la persona afectada, guarda evidencia con capturas, usa las herramientas de denuncia y busca ayuda de un adulto o una institución cuando se trate de menores.</p>
     <blockquote class="q">En los tableros de esta wiki aplicamos lo mismo: una tarjeta llega a Hecho solo si otra persona la revisó y citó sus fuentes.</blockquote>`,
   think:'¿Alguna vez compartiste algo que luego resultó falso? ¿Qué te habría ayudado a detectarlo a tiempo?', emojis:['⚖️','🔍','🤝','©️','🤖','💬'], video:{url:'https://www.youtube.com/watch?v=PCHAGVftN1I', title:'What is: Digital Ethics?', ch:'Vlerick Business School', note:'En inglés · 4 minutos · explica por qué la ética debe estar presente al diseñar tecnología. Activa los subtítulos.'} },
 { id:'brecha', n:6, tag:'Brecha digital', e:'🌉', c:'var(--coral)', ct:'var(--t-coral)', min:4,
   t:'La brecha digital: quién se queda por fuera',
   sum:'Tener internet no basta: la brecha también está en lo que sabemos hacer con él y en lo que logramos gracias a él.',
   body:`<p>Solemos pensar la brecha digital como la diferencia entre quien tiene computador e internet y quien no. Esa es solo la primera capa. Van Deursen y Helsper (2015) describen tres niveles:</p>
     <ul class="cards"><li><b class="h">Acceso:</b> tener o no dispositivos y conectividad de calidad.</li><li><b class="h">Uso y habilidades:</b> saber o no aprovechar la tecnología para estudiar, trabajar o participar.</li><li><b class="h">Resultados:</b> obtener o no beneficios reales, como un empleo, un trámite resuelto o un aprendizaje.</li></ul>
     <p>Dos personas con el mismo celular pueden vivir realidades muy distintas: una lo usa para aprender, crear y defender sus derechos; otra solo para entretenerse, o casi no lo usa porque nadie le enseñó.</p>
     <h2>No basta con repartir equipos</h2>
     <p>El informe de la UNESCO (2023) recuerda que la tecnología no mejora el aprendizaje por sí sola: depende de cómo se usa, de la formación docente y del contexto. Cristóbal Cobo (2016) lo resume así: adoptar tecnología no es lo mismo que innovar.</p>
     <h2>Una mirada desde América Latina</h2>
     <p>Jesús Martín-Barbero (2006) insistió en que las tecnologías deben pensarse desde las culturas y realidades locales, no como copia de modelos del norte global. En zonas rurales o con baja conectividad, la alfabetización digital puede empezar con recursos sin conexión, aprendizaje entre generaciones y proyectos ligados a los problemas de la comunidad.</p>
     <blockquote class="q">Cerrar la brecha digital no es poner a todos frente a una pantalla, sino lograr que todos puedan decidir qué hacer con ella.</blockquote>`,
   think:'En tu entorno, ¿quién se está quedando por fuera de la red? ¿Qué podrías enseñarle tú?', emojis:['🌉','🌎','📦','🤝','🏘️','💬'], video:{url:'https://www.youtube.com/watch?v=2bpx41zpE5s', title:'Desigualdad digital: explicaciones locales de patrones globales', ch:'Conferencia de Ellen Helsper en Montevideo · REVISTAONDA', note:'En español · conferencia de Ellen Helsper, coautora de los tres niveles de la brecha digital.'} }
];

}

function methodHTML(){
  return `<p>Esta wiki no se lee y ya: se <b class="h">trabaja</b>. Cada entrada del blog y el proyecto de la campaña tienen un tablero Kanban compartido por todo el curso, para que se vea qué tareas están pendientes, cuáles avanzan y cuáles ya se terminaron.</p>
   <h2>Las columnas de nuestros tableros</h2>
   <div class="cols4">
     <div style="background:var(--sky)"><b>📝 Por hacer</b>Prácticas del blog que aún no empiezas: revisar permisos, aplicar lectura lateral, entrevistar a alguien.</div>
     <div style="background:var(--sun)"><b>⚙️ En progreso</b>Lo que estás haciendo ahora. Máximo 5 tarjetas a la vez en cada tablero.</div>
     <div style="background:var(--pink)"><b>🔎 Revisión</b>Otra persona revisa tu trabajo. Máximo 4 tarjetas a la vez.</div>
     <div style="background:var(--mint)"><b>✅ Hecho</b>Tarea terminada que cumple nuestra definición de hecho.</div>
   </div>
   <h2>Nuestras reglas</h2>
   <ul class="cards">
     <li><b class="h">Definición de hecho:</b> una tarjeta llega a Hecho solo si otra persona la revisó y citó sus fuentes, como se aprende en la entrada 5 del blog. Las listas de la <a href="#/herramientas">Caja de herramientas</a> sirven como criterios.</li>
     <li><b class="h">Límite WIP:</b> no se puede empezar todo a la vez. Si “En progreso” está llena, primero se termina algo. Así aplicamos lo que el blog dice sobre la atención dispersa.</li>
     <li><b class="h">Nickname y cero datos personales:</b> como enseña la entrada 4, tus datos valen. Participas con un Nickname y no escribes teléfono, dirección ni colegio.</li>
     <li><b class="h">Sin dispositivo, tablero físico:</b> si no hay conexión o equipos, el curso usa un tablero en el salón con tarjetas de papel. Así cuidamos lo que dice la entrada 6 sobre la brecha digital.</li>
   </ul>
   <h2>Roles y sprints</h2>
   <p>En el proyecto de la campaña trabajan equipos de cuatro o cinco estudiantes durante cuatro <i>sprints</i> de dos semanas. En cada <i>sprint</i> los roles rotan:</p>
   <ul class="cards">
     <li><b class="h">Scrum Master:</b> facilita las reuniones y cuida los acuerdos.</li>
     <li><b class="h">Product Owner:</b> representa a la comunidad destinataria; al inicio lo asume el docente.</li>
     <li><b class="h">Verificador/a de fuentes:</b> aplica la lectura lateral y la lista de noticias.</li>
     <li><b class="h">Time Keeper:</b> cuida los tiempos del <i>sprint</i>.</li>
   </ul>
   <h2>Lo que tomamos del referente</h2>
   <p>El material del Eje 3 propone los tableros digitales con columnas como “Por hacer”, “En progreso” y “Completado”, porque favorecen la transparencia y la responsabilidad entre los participantes (Galindo Cuesta, s. f.). Además, de ese mismo referente tomamos tres ideas más:</p>
   <ul class="cards">
     <li><b class="h">Design thinking</b> para ordenar el proyecto en empatía, ideación y prototipado.</li>
     <li><b class="h">Analítica del aprendizaje</b> en versión sencilla: miramos tarjetas estancadas, avance en las listas y resultado del quiz, siempre con transparencia y sin sancionar.</li>
     <li><b class="h">Microcredenciales</b> como las cuatro insignias de tu pasaporte, que reconocen lo que haces y no solo lo que lees.</li>

}

 and Information Technologies Annual</i> (Studies in Media and Communications, Vol. 10), 29–52. Emerald.","Vuorikari, R., Kluzer, S., &amp; Punie, Y. (2022). <i>DigComp 2.2: The digital competence framework for citizens</i>. Publications Office of the European Union.","White, D. S., &amp; Le Cornu, A. (2011). Visitors and residents: A new typology for online engagement. <i>First Monday, 16</i>(9).","Wineburg, S., &amp; McGrew, S. (2019). Lateral reading and the nature of expertise. <i>Teachers College Record, 121</i>(11), 1–40.","Zuboff, S. (2019). <i>The age of surveillance capitalism</i>. PublicAffairs."];

function initTools(){
  const host = $('#tools');
  host.innerHTML = TOOLS.map(t => { const d = load('cr-'+t.key, []);
    return `<div class="tool" data-key="${t.key}"><div class="head" style="background:${t.c}"><span aria-hidden="true">${t.e}</span><h3>${t.title}</h3></div><ul>
    ${t.items.map((it,i) => `<li><label><input type="checkbox" data-i="${i}" ${d.includes(i)?'checked':''}><span class="box" aria-hidden="true"></span><span class="t">${it}</span></label></li>`).join('')}
    </ul><div class="foot"><div class="bar" aria-hidden="true"><b style="background:${t.c}"></b></div><p class="progress"></p></div></div>`; }).join('');
  const upd = box => { const c = [...box.querySelectorAll('input')], k = c.filter(x => x.checked).length;
    box.querySelector('.bar b').style.width = (k/c.length*100)+'%';
    box.querySelector('.progress').textContent = k === c.length ? '🎉 Completaste esta lista.' : k+' de '+c.length+' prácticas marcadas.'; };
  host.querySelectorAll('.tool').forEach(b => { upd(b); b.addEventListener('change', () => { save('cr-'+b.dataset.key, [...b.querySelectorAll('input')].filter(x => x.checked).map(x => +x.dataset.i)); upd(b); }); });

/* ---------- Glosario ---------- */
function initGloss(){
  const gl = $('#gloss');
  gl.innerHTML = GLOSS.map(([t,d],i) => `<div class="fc"><button type="button" aria-pressed="false" aria-label="${esc(t)}. Toca para ver la definición"><span class="face front${GC[i%GC.length]==='#7B4DFF'?' light':''}" style="background:${GC[i%GC.length]}"><span style="font-size:2.2rem" aria-hidden="true">${GE[i]||'⭐'}</span><strong>${esc(t)}</strong><small>Toca para ver 👆</small></span><span class="face back">${esc(d)}</span></button></div>`).join('');
  gl.querySelectorAll('.fc button').forEach(b => b.addEventListener('click', () => { const f = b.parentElement.classList.toggle('flip'); b.setAttribute('aria-pressed', f); }));
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  $('#gq').addEventListener('input', e => { const q = norm(e.target.value.trim()); let n = 0;
    gl.querySelectorAll('.fc').forEach(c => { const ok = !q || norm(c.textContent).includes(q); c.classList.toggle('hide', !ok); if(ok) n++; });
    $('#gEmpty').style.display = n ? 'none' : 'block'; });
}

/* ---------- Quiz ---------- */
function initQuiz(){
  const box = $('#quiz'); let order = shuffle(GAME_Q.map((_,k) => k)).slice(0, 8), i = 0, score = 0;
  function ask(){
    const Q = GAME_Q[order[i]];
    const opts = shuffle(Q.a.map((t,k) => ({t, ok:k===0})));
    box.innerHTML = '<div class="qbar" aria-hidden="true"><b style="width:'+(i/order.length*100)+'%"></b></div><p class="hint">Pregunta '+(i+1)+' de '+order.length+' · Aciertos: '+score+'</p><span class="who">📚 '+esc(Q.who)+'</span><div class="qq">'+esc(Q.q)+'</div><div id="opts"></div><div id="fb"></div>';
    const o = box.querySelector('#opts');
    opts.forEach(op => {
      const b = document.createElement('button'); b.type='button'; b.className='opt'; b.textContent = op.t;
      b.onclick = () => {
        o.querySelectorAll('button').forEach(x => x.disabled = true);
        if(op.ok) score++;
        b.classList.add(op.ok ? 'ok' : 'no');
        if(!op.ok){ [...o.children].forEach(x => { if(opts.find(y => y.t === x.textContent).ok) x.classList.add('ok'); }); }
        box.querySelector('#fb').innerHTML = '<div class="fb">'+(op.ok?'🎉 ¡Correcto! ':'💦 Casi. ')+esc(Q.why)+'</div><button class="btn small" type="button" id="nx">'+(i===order.length-1?'🏁 Ver resultado':'Siguiente ➡️')+'</button>';
        const nx = box.querySelector('#nx'); nx.onclick = () => { i++; if(i < order.length) ask(); else end(); }; nx.focus({preventScroll:true});
      };
      o.appendChild(b);
    });
  }
  function end(){
    PASS.quiz = Math.max(PASS.quiz, score); updatePass();
    const msg = score >= 6 ? '🏅 ¡Ciudadano/a en red! Dominas los conceptos y los autores del blog.' : score >= 4 ? '🐸 ¡Llegaste a la otra orilla! Repasa las entradas que fallaste.' : '🌱 Buen comienzo. Vuelve a leer las entradas y juega otra vez.';
    box.innerHTML = '<div class="qbar" aria-hidden="true"><b style="width:100%"></b></div><div class="qq">Acertaste '+score+' de '+order.length+'</div><div class="fb">'+msg+'</div><button class="btn" type="button" id="again">🔁 Jugar otra vez</button><a class="btn alt" href="#/cibercultura">📚 Repasar las entradas</a>';
    box.querySelector('#again').onclick = () => { order = shuffle(GAME_Q.map((_,k) => k)).slice(0, 8); i = 0; score = 0; ask(); };
  }
  ask();
}

/* ---------- Ruteo ---------- */
function route(){
  const id = currentId();
  if(id !== 'inicio' && !PASS.visited.includes(id)) PASS.visited.push(id);
  renderPage(id); updatePass();
  document.title = (id==='inicio' ? 'Wiki Ciudadanía en Red' : PAGES.find(p=>p.id===id).t + ' | Wiki Ciudadanía en Red');
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
